name: Parkrun Roster Check

on:
  schedule:
    # Run every Wednesday at 10:00 UTC
    - cron: '0 10 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-roster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Roster Check
        run: |
          # Generate the raw message file
          python check_roster.py --outfile latest_message.txt --plain

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update roster message"
          file_pattern: latest_message.txt
