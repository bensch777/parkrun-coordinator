name: Parkrun Roster Check

on:
  schedule:
    # Run every Wednesday at 10:00 UTC
    - cron: '0 10 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-roster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Roster Check
        env:
          ROSTER_PROXY: ${{ secrets.ROSTER_PROXY }}
        run: |
          # Generate the raw message file using the proxy if set
          if [ -n "$ROSTER_PROXY" ]; then
            python check_roster.py --outfile latest_message.txt --plain --proxy "$ROSTER_PROXY"
          else
            echo "Warning: No ROSTER_PROXY secret set. Attempting direct connection..."
            python check_roster.py --outfile latest_message.txt --plain
          fi

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update roster message"
          file_pattern: latest_message.txt
