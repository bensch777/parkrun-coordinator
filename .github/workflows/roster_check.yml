name: Parkrun Roster Check

on:
  schedule:
    # Run every Wednesday at 10:00 UTC
    - cron: '0 10 * * 3'
  workflow_dispatch:

jobs:
  check-roster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Roster Check
        id: roster
        run: |
          python check_roster.py --outfile roster_issue_body.md

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          # Required mail server address:
          server_address: smtp.gmail.com
          # Server port, default 25:
          server_port: 465
          # Optional (recommended): mail server username:
          username: ${{ secrets.MAIL_USERNAME }}
          # Optional (recommended): mail server password:
          password: ${{ secrets.MAIL_PASSWORD }}
          # Required mail subject:
          subject: Parkrun Helfer Check
          # Required recipients addresses:
          to: ${{ secrets.MAIL_USERNAME }} # Sending to self by default
          # Required sender full name (optional):
          from: Parkrun Bot
          # Optional plain body:
          body: file://roster_issue_body.md
          # Optional priority: 'low', 'normal' (default) or 'high'
          priority: normal
